services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: postgres:14
    container_name: database
    restart: always
    ports:
      - '5432:5432'
    env_file:
      - .env
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database:
    name: database-db
